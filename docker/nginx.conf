# No nginx version in the Server header or on error pages.
server_tokens off;

server {
    listen       8080;
    # The IPv6 listener when the host has IPv6, written at start by
    # listen-ipv6.sh. Files under /tmp/inbuxa-admin are made at every start, so
    # the image works with a read-only root filesystem and /tmp on a tmpfs.
    include      /tmp/inbuxa-admin/listen.conf;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers, and the console's Content-Security-Policy, which
    # 40-api-base-url.sh writes at start because it names the mail server.
    # An add_header in a location drops every add_header of the server block,
    # so each location below that adds a header includes these again.
    include      /etc/nginx/inbuxa/security-headers.conf;
    include      /tmp/inbuxa-admin/csp.conf;

    # A single-page app: every path that is not a file on disk is the app's own
    # route, and the app is what decides what it means. Without this, a reload
    # anywhere but the root is a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so the content at a given name never changes. index.html
    # is deliberately not in here: it is the file that names the current hashes,
    # and a cached one pins a deployment to the build it replaced.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/inbuxa/security-headers.conf;
        include /tmp/inbuxa-admin/csp.conf;
    }

    # The Sieve playground has inline scripts, runs WebAssembly and talks to
    # nothing but its own files, so it has a policy of its own.
    location ^~ /sieve-playground/ {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/inbuxa/security-headers.conf;
        include /etc/nginx/inbuxa/playground-csp.conf;
    }

    # Where this build's source is (https://coffeylabs.org/specs/well-known-source/).
    # Exact, so a build without one is a 404, not the app.
    location = /.well-known/source {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/inbuxa/security-headers.conf;
        include /tmp/inbuxa-admin/csp.conf;
        try_files $uri =404;
    }

    # The copy 40-api-base-url.sh made at start, with the mail server's
    # address in it: the image's own is never served.
    location = /index.html {
        root /tmp/inbuxa-admin;
        add_header Cache-Control "no-cache";
        include /etc/nginx/inbuxa/security-headers.conf;
        include /tmp/inbuxa-admin/csp.conf;
    }
}
