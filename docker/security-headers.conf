# Sent with every response, the console's and the playground's alike. Each is
# included from the server block and again from every location that adds a
# header of its own (nginx.conf says why). The Content-Security-Policy is
# separate: the console's names the mail server and is written at start.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
