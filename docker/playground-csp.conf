# The Sieve playground's policy (sieve-playground/, built in inbuxa-server).
# Its page has two inline scripts and an inline onerror handler, allowed by
# their hashes: rebuilding the playground changes them, and docker/nginx.test.ts
# fails until they are updated here. Monaco adds <style> elements, and the
# interpreter is WebAssembly, run in a worker.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-hashes' 'sha256-3/8iWebuPJND/w0ovIom8xC4XfP8t4S3p0NxEVeBMMA=' 'sha256-Nyso9HVjfUu8/s6uYDj/NGw/1v5jOy55BsZNr7Kd1/g=' 'sha256-9e4wKWmsQ1MLfMUu6QsD57zsaXqVaF4a9q1T0dJLkqY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
